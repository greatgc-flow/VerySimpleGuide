name: Validate guide

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verysimple-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements-validation.txt
      - name: Run complete structural and negative validation
        run: python tools/validate_package.py --evidence-file .validation/ci-evidence.txt
