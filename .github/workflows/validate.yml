name: Validate guide

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verysimple-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements-validation.txt
      - name: Run audit regression tests
        run: python -I -m unittest discover -s tools -p test_validator.py -v
      - name: Run complete structural and negative validation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--require-fs-tests --project-trace 04_ASSURANCE/package-trace.json --evidence-file .validation/ci-evidence.txt)
          if [ -n "$BASE_SHA" ]; then
            mkdir -p .validation
            git show "$BASE_SHA:04_ASSURANCE/package-trace.json" > .validation/prior-trace.json
            args+=(--prior-project-trace .validation/prior-trace.json)
          fi
          python -I tools/validate_package.py "${args[@]}"
          if [ -n "$BASE_SHA" ]; then
            grep -qx 'prior_project_trace=COMPARED' .validation/ci-evidence.txt
          fi
